<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playwright Demo</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1rem; }
      label { display: block; margin-bottom: 0.5rem; }
      input, button { font: inherit; padding: 0.6rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Playwright Demo</h1>
      <p>Enter your name to try the greeting form.</p>
      <form>
        <label for="name">Your name</label>
        <input id="name" name="name" required autocomplete="given-name">
        <button type="submit">Say hello</button>
      </form>
      <p role="status" aria-live="polite"></p>
    </main>
    <script>
      document.querySelector('form').addEventListener('submit', (event) => {
        event.preventDefault();
        const name = document.querySelector('#name').value.trim();
        document.querySelector('[role="status"]').textContent = name
          ? `Hello, ${name}!`
          : 'Please enter your name.';
      });
    </script>
  </body>
</html>
